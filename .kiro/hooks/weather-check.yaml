name: Weather Check
description: Check weather and update theme when user mentions weather
trigger: on_message
condition: |
  message.toLowerCase().includes('weather') || 
  message.toLowerCase().includes('theme') ||
  message.toLowerCase().includes('날씨')
action:
  type: message
  content: |
    I'll check the weather and update the theme for you.
    
    The Sit or Live app automatically:
    - Fetches weather data from Open-Meteo API
    - Applies appropriate Halloween theme based on conditions
    - Updates your IDE and terminal themes
    
    Current themes available:
    - ☀️ Daylight Survivor (Clear/Sunny)
    - 🌙 Vampire Night (Clear Night)
    - 🌫️ Silent Hill (Foggy)
    - 🌧️ Rainy Cemetery (Rainy)
    - ❄️ Frozen Dead (Snowy)
    - ⚡ Frankenstein Lab (Stormy)
