name: Health Monitor Reminder
description: Remind developer to take breaks when saving code files
trigger: on_save
condition: |
  file.endsWith('.ts') || 
  file.endsWith('.tsx') || 
  file.endsWith('.rs') ||
  file.endsWith('.js') ||
  file.endsWith('.jsx') ||
  file.endsWith('.py')
action:
  type: message
  content: |
    💪 Great work! Remember to take care of your health:
    
    👀 20-20-20 Rule: Every 20 minutes, look at something 20 feet away for 20 seconds
    🧟 Zombie Warning: Don't sit idle for more than 30 minutes
    🚶 Take breaks: Stand up and stretch regularly
    
    Your Sit or Live app is monitoring your activity and will remind you!
