name: Session Start
description: Welcome message and project context when starting a new session
trigger: on_session_start
action:
  type: message
  content: |
    🧟 Welcome to Sit or Live Development!
    
    Quick Start:
    - `npm run tauri:dev` - Start desktop app
    - `npm run generate-themes` - Regenerate theme files
    - `npm test` - Run tests
    
    Project Structure:
    - `src/` - React frontend (TypeScript)
    - `src-tauri/` - Rust backend
    - `src-tauri/themes/` - 42 theme files (6 themes × 7 platforms)
    - `src/services/` - Business logic layer
    
    Features:
    ✅ Weather-based theme switching
    ✅ Health monitoring (idle time, activity level)
    ✅ Eye health (20-20-20 rule)
    ✅ Multi-platform support (VS Code, Kiro, iTerm2, Warp, Kitty, Hyper, Terminal)
    ✅ Discord notifications
    ✅ Multi-language (EN/KO)
    
    Need help? Check `docs/refact/` for detailed specifications!
